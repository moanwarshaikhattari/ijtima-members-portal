{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% include "head.html" %}
  <title>{{ title }}</title>
  <!-- Choices.js CSS added for proper rendering -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" /> -->
  <style>
     .error {
      font-size: 12px;
      margin-top: 5px;
      color: #dc3545;
    }
    .choices__inner{
      background-color: #ffff;
      border-radius: 6px;
      padding-bottom:0;
    }
    .choices{
      margin-bottom: 3px;
    }
  </style>
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    {% include "sidebar.html" %}

    <div class="admin-main">
      {% include "header.html" %}

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-person-lines-fill" aria-hidden="true"></i></span>
              <div>
                <h1 class="h3 mb-1">Edit Member Details</h1>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-outline-secondary btn-sm" href="{% url 'members' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Members</a>
              <a class="btn btn-primary btn-sm" href="{% url 'addmember' %}"><i class="bi bi-person-plus" aria-hidden="true"></i> Add Member</a>
            </div>
          </div>

          <section class="row g-3 mb-lg-0 mb-5">
            <div class="col-12 col-xl-12">
              <form id="contactForm" method="POST" action="{% url 'memberdetails' member.id %}" class="panel">
                {% csrf_token %}
                <div class="panel-header">
                  <div>
                    <!-- <h2 class="h5 mb-1 section-title"><i class="bi bi-pencil-square" aria-hidden="true"></i><span>Update Member Information</span></h2> -->
                    <p class="text-muted mb-0">Added by Zimmedar: <strong>{{ member.zimmedar_name }}</strong></p>
                  </div>
                </div>

                <div class="row g-3">
                  <!-- Full Name -->
                  <div class="col-md-6">
                    <label class="form-label" for="firstName">Full Name*</label>
                    <input class="form-control" id="firstName" name="name" type="text" value="{{ member.name }}" oninput="this.value = this.value.replace(/[^A-Za-z ]/g, '')">
                    <div class="error" id="errorName"></div>
                  </div>
                  
                  <!-- Mobile Number -->
                  <div class="col-md-6">
                    <label class="form-label" for="phone">Mobile Number*</label>
                    <input class="form-control" id="phone" name="mobile" type="text" value="{{ member.mobile }}" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);">
                    <div class="error" id="errorMobile"></div>
                  </div>
                  
                  <!-- Searchable Dropdown -->
                  <div class="col-md-6">
                    <label class="form-label" for="location">Location*</label>
                    <select class="form-select form-control mb-0" id="location" name="location">
                      <option value="">--Select Location--</option>
                      {% for key, value in Member.LOCATION_CHOICES %}
                          <option value="{{ key }}" {% if member.location == key %}selected{% endif %}>
                              {{ value }}
                          </option>
                      {% endfor %}
                    </select>
                    <div class="error" id="errorLocation"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="blood">Blood Donate*</label>
                    <select class="form-select form-control mb-0" id="blood" name="blood">
                      <option value="">--Select Blood Donate--</option>
                      {% for key, value in Member.BLOOD_CHOICES %}
                          <option value="{{ key }}" {% if member.blood_donate == key %}selected{% endif %}>
                              {{ value }}
                          </option>
                      {% endfor %}
                    </select>
                    <div class="error" id="errorBlood"></div>
                  </div>
                </div>

                <div class="d-flex flex-wrap justify-content-end gap-2 mt-3">
                  <a href="{% url 'members' %}" class="btn btn-outline-secondary" id="cancelBtn">Cancel</a>
                  <button class="btn btn-primary" type="submit" id="submitBtn"><i class="bi bi-check2-circle" aria-hidden="true"></i> Save Changes</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
      {% include "footer-navbar.html" %}
    </div>
  </div>

  <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. Initialize Searchable Dropdown
      const locationSelect = document.getElementById('location');
      if (locationSelect) {
        new Choices(locationSelect, {
          searchEnabled: true,
          itemSelectText: '',
          shouldSort: false,
          placeholder: false,
          placeholderValue: 'Select Location',
        });
      }

      const bloodSelect = document.getElementById('blood');
      if (bloodSelect) {
        new Choices(bloodSelect, {
          searchEnabled: false,
          itemSelectText: '',
          shouldSort: false,
          placeholder: false,
          placeholderValue: 'Select blood donate',
        });
      }

      // 2. Form Submit Validation Logic
      const form = document.getElementById("contactForm");
      if (form) {
        form.onsubmit = function (e) {
          const submitBtn = document.getElementById('submitBtn');
          
          // Reset error messages safely
          const errName = document.getElementById("errorName");
          const errMobile = document.getElementById("errorMobile");
          const errLocation = document.getElementById("errorLocation");
          const errBlood = document.getElementById("errorBlood");

          if (errName) errName.innerText = "";
          if (errMobile) errMobile.innerText = "";
          if (errLocation) errLocation.innerText = "";
          if (errBlood) errLocation.innerText = "";

          let valid = true;

          const name = document.querySelector("[name='name']").value.trim();
          const mobile = document.querySelector("[name='mobile']").value.trim();
          const location = document.querySelector("[name='location']").value.trim();
          const blood = document.querySelector("[name='blood']").value.trim();

          if (name === "") {
            if (errName) errName.innerText = "Name is required.";
            valid = false;
          }

          if (!/^\d{10}$/.test(mobile)) {
            if (errMobile) errMobile.innerText = "Mobile number must be exactly 10 digits.";
            valid = false;
          }

          if (location === "") {
            if (errLocation) errLocation.innerText = "Location is required.";
            valid = false;
          }

          if (blood === "") {
            document.getElementById("errorBlood").innerText = "Select Blood Donate YRS or NO";
            valid = false;
          }

          if (valid) {
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Processing...`;
            submitBtn.disabled = true;
          } else {
            e.preventDefault(); // Stop form submission on error
          }
        };
      }

      // 3. Cancel Button Logic
      const cancelBtn = document.getElementById("cancelBtn");
      if (cancelBtn) {
        cancelBtn.addEventListener("click", function (e) {
          // Clears active errors if needed before redirection
          if (document.getElementById("errorName")) document.getElementById("errorName").innerText = "";
          if (document.getElementById("errorMobile")) document.getElementById("errorMobile").innerText = "";
          if (document.getElementById("errorLocation")) document.getElementById("errorLocation").innerText = "";
          if (document.getElementById("errorLocation")) document.getElementById("errorBlood").innerText = "";
        });
      }
    });
  </script>
</body>
</html>
