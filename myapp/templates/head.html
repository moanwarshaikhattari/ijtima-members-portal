{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Navi Mumbai Members Portal">

<!-- WhatsApp / Facebook Preview Image -->
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/images/di-logo.png' %}">
<meta property="og:image:secure_url" content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/images/di-logo.png' %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/vendors/bootstrap-icons/bootstrap-icons.css' %}">
<link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"> -->
 <!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<!-- Select2 Bootstrap 5 Theme CSS (Match with Bootstrap styling) -->
<link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />

<style>
    .alert-dismissible .btn-close{
      padding: 10px !important;
    }
    .alert{
      padding: 5px 12px !important;
    }
    .alert-dismissible {
        margin-bottom: 7px !important;
    }
    .select2-container--bootstrap-5 .select2-dropdown .select2-results__options .select2-results__option.select2-results__option--selected, .select2-container--bootstrap-5 .select2-dropdown .select2-results__options .select2-results__option[aria-selected=true]:not(.select2-results__option--highlighted)
      {
          color: #fff;
          background-color: #198754;
      }
</style>
<style>
  /* Dark Mode Input Box Overrides */
  body.dark-mode .form-control,
  [data-bs-theme="dark"] .form-control,
  .dark-mode .form-control {
    background-color: #1b263b !important;
    color: #ffffff !important;
    border: 1px solid #2b3d5b !important;
  }

  body.dark-mode .form-control::placeholder,
  [data-bs-theme="dark"] .form-control::placeholder,
  .dark-mode .form-control::placeholder {
    color: #8b9bb4 !important;
  }

  /* Dark Mode Select2 Container (Location & Profession Dropdowns) */
  body.dark-mode .select2-container--bootstrap-5 .select2-selection--single,
  [data-bs-theme="dark"] .select2-container--bootstrap-5 .select2-selection--single,
  .dark-mode .select2-container--bootstrap-5 .select2-selection--single,
  body.dark-mode .select2-container--default .select2-selection--single,
  [data-bs-theme="dark"] .select2-container--default .select2-selection--single,
  .dark-mode .select2-container--default .select2-selection--single {
    background-color: #1b263b !important;
    border: 1px solid #2b3d5b !important;
    color: #ffffff !important;
  }

  /* Select2 Text & Placeholder in Dark Mode */
  body.dark-mode .select2-selection__rendered,
  [data-bs-theme="dark"] .select2-selection__rendered,
  .dark-mode .select2-selection__rendered {
    color: #ffffff !important;
  }

  body.dark-mode .select2-selection__placeholder,
  [data-bs-theme="dark"] .select2-selection__placeholder,
  .dark-mode .select2-selection__placeholder {
    color: #8b9bb4 !important;
  }

  /* Select2 Open Dropdown Menu Dark Theme */
  body.dark-mode .select2-dropdown,
  [data-bs-theme="dark"] .select2-dropdown,
  .dark-mode .select2-dropdown {
    background-color: #1b263b !important;
    border: 1px solid #2b3d5b !important;
    color: #ffffff !important;
  }

  body.dark-mode .select2-search__field,
  [data-bs-theme="dark"] .select2-search__field,
  .dark-mode .select2-search__field {
    background-color: #0d1b2a !important;
    color: #ffffff !important;
    border: 1px solid #2b3d5b !important;
  }

  body.dark-mode .select2-results__option--highlighted[aria-selected],
  [data-bs-theme="dark"] .select2-results__option--highlighted[aria-selected],
  .dark-mode .select2-results__option--highlighted[aria-selected] {
    background-color: #2b3d5b !important;
    color: #ffffff !important;
  }
</style>
