{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% include "head.html" %}
  <title>{{ title }}</title>
  <style>
     .error{
      font-size:12px;
      margin-top:5px;
    }
    .choices__inner{
      background-color: #ffff;
      border-radius: 6px;
      padding:0 !important;
      font-size: 16px !important;
      min-height: 38px !important;
    }
    .choices{
      margin-bottom: 3px;
    }
    .choices[data-type*=select-one] .choices__inner {
      /* padding-bottom: var(--choices-inner-one-padding, 0px); */
      padding-left: 6px !important;
    }
    
  </style>
</head>

<body>
  <div class="admin-shell">

    {% include "sidebar.html" %}

    <div class="admin-main">
      {% include "header.html" %}

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-person-plus" aria-hidden="true"></i></span>
              <div>
                <!-- <p class="eyebrow mb-1">Management</p> -->
                <h1 class="h3 mb-1">Add Member Information</h1>
                <!-- <p class="text-muted mb-0">Create a new user account with role and team assignments.</p> -->
              </div>
            </div>
            <div class="heading-actions"><a class="btn btn-outline-success btn-sm" href="{% url 'members' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Members</a></div>
          </div>

          <section class="row g-3 mb-lg-0 mb-5">
            <div class="col-12 col-xl-12">
              <!-- {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>Success!</strong> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %} -->
              
              <form id="contactForm" method="POST" action="{% url 'addmember' %}" class="panel">
                {% csrf_token %}
                <!-- <div class="panel-header">
                  <div>
                    <h2 class="h5 mb-1 section-title"><i class="bi bi-person-plus" aria-hidden="true"></i><span>Add Member Information</span></h2>
                    <p class="text-muted mb-0">Create a Member Information with validated fields.</p>
                  </div>
                </div> -->
                
                <div class="row g-3">
                  <div class="col-md-6 mt-1">
                    <label class="form-label" for="firstName">First & Last Name<strong class="text-danger">*</strong></label>
                    <input class="form-control" id="firstName" name="name" type="text" placeholder="Enter First Name & Last Name" oninput="this.value = this.value.replace(/[^A-Za-z ]/g, '')">
                    <div class="text-danger error" id="errorName"></div>
                  </div>
                  
                  <!-- <div class="col-md-6">
                    <label class="form-label" for="phone">Mobile Number*</label>
                    <input class="form-control" id="phone" name="mobile" type="text" placeholder="Enter 10 Digit Mobile Number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);">
                    <div class="text-danger error" id="errorMobile"></div>
                  </div> -->
                  <div class="col-md-6 mt-1">
                    <label class="form-label" for="phone">Mobile Number<strong class="text-danger">*</strong></label>
                    <input class="form-control" id="phone" name="mobile" type="text" value="{{ entered_mobile }}" placeholder="Enter 10 Digit Mobile Number" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);">
                    
                    {% if error_mobile %}
                      <div class="text-danger error mt-1" id="errorMobile">{{ error_mobile }}</div>
                    {% else %}
                      <div class="text-danger error" id="errorMobile"></div>
                    {% endif %}
                  </div>
                  
                  <div class="col-md-4 mt-1">
                    <label class="form-label" for="location">Location<strong class="text-danger">*</strong></label>
                    <select class="form-select location-dropdown mb-0" id="location" name="location">
                      <!-- Placeholder ke liye empty option zaroori hai -->
                      <option></option>
                      {% for key, value in Member.LOCATION_CHOICES %}
                          <option value="{{ key }}" {% if entered_location == key %}selected{% endif %}>
                              {{ value }}
                          </option>
                      {% endfor %}
                    </select>
                    <div class="text-danger error" id="errorLocation"></div>
                  </div>
                  <div class="col-md-4 mt-1">
                    <label class="form-label" for="profession">Profession<strong class="text-danger">*</strong></label>
                    <select class="form-select profession-dropdown mb-0" id="profession" name="profession">
                      <!-- Placeholder ke liye empty option zaroori hai -->
                      <option></option>
                      {% for key, value in Member.PROFESSION_CHOICES %}
                          <option value="{{ key }}" {% if entered_profession == key %}selected{% endif %}>
                              {{ value }}
                          </option>
                      {% endfor %}
                    </select>
                    <div class="text-danger error" id="errorProfession"></div>
                  </div>

                  
                  <div class="col-md-4 mt-1">
                    <label class="form-label">Blood Donate<strong class="text-danger">*</strong></label>

                    <div class="" role="group" aria-label="Blood Donate">

                        <!-- YES Button -->
                        <input type="radio" class="btn-check" name="blood" id="bloodYes" value="YES" autocomplete="off"
                            {% if member.blood_donate == 'YES' or entered_blood == 'YES' %}checked{% endif %}>
                        <label class="btn btn-outline-success" for="bloodYes">
                            YES
                        </label>

                        <!-- NO Button -->
                        <input type="radio" class="btn-check" name="blood" id="bloodNo" value="NO" autocomplete="off"
                            {% if member.blood_donate == 'NO' or entered_blood == 'NO' %}checked{% endif %}>
                        <label class="btn btn-outline-danger" for="bloodNo">
                            NO
                        </label>
                    </div>
                    <div class="text-danger error" id="errorBlood"></div>
                  </div>
                </div>

                <div class="d-flex flex-wrap justify-content-end gap-2 mt-3">
                  <button type="button" class="btn btn-outline-danger" id="cancelBtn">Cancel</button>
                  <button class="btn btn-success" type="submit" id="submitBtn"><i class="bi bi-person-check" aria-hidden="true"></i> Create Member</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
      {% include "footer-navbar.html" %}
      <!-- {% include "footer.html" %} -->
    </div>
  </div>

  <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>
  
  <!-- searchable drop down  -->
  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script> -->

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <script>
    $(document).ready(function() {
  // Initialize Location Dropdown
      $('.location-dropdown').select2({
        theme: 'bootstrap-5',
        placeholder: 'Search or Select Location...',
        allowClear: true,
        width: '100%'
      });

      // Initialize Profession Dropdown
      $('.profession-dropdown').select2({
        theme: 'bootstrap-5',
        placeholder: 'Search or Select Profession...',
        allowClear: true,
        width: '100%'
      });

      // 2. Fix for Mobile View Keypad Open Issue:
      // When Select2 dropdown opens, force focus on its search input field
      $(document).on('select2:open', () => {
        let searchField = document.querySelector('.select2-container--open .select2-search__field');
        if (searchField) {
          searchField.focus();
        }
      });

      // 3. Cancel Button Click Event (Reset Form + Clear Select2)
      $('#cancelBtn').on('click', function() {
        const form = document.getElementById("contactForm");

        // Standard Form Reset
        form.reset();

        // Clear Select2 Dropdowns & Trigger Change event
        $('.location-dropdown, .profession-dropdown').val(null).trigger('change');

        // Clear all text error messages
        $('#errorName, #errorMobile, #errorLocation, #errorProfession, #errorBlood').text('');
      });
    });

    // 4. Form Validation & Processing State
    document.getElementById("contactForm").onsubmit = function (e) {
      const submitBtn = document.getElementById('submitBtn');

      // Clear previous errors
      document.getElementById("errorName").innerText = "";
      document.getElementById("errorMobile").innerText = "";
      document.getElementById("errorLocation").innerText = "";
      document.getElementById("errorProfession").innerText = "";
      document.getElementById("errorBlood").innerText = "";

      let valid = true;

      const name = document.querySelector("[name='name']").value.trim();
      const mobile = document.querySelector("[name='mobile']").value.trim();
      const location = document.querySelector("[name='location']").value.trim();
      const profession = document.querySelector("[name='profession']").value.trim();
      const blood = document.querySelector("input[name='blood']:checked");

      if (name === "") {
        document.getElementById("errorName").innerText = "Name is required.";
        valid = false;
      }

      if (!/^\d{10}$/.test(mobile)) {
        document.getElementById("errorMobile").innerText = "Mobile number must be 10 digits.";
        valid = false;
      }

      if (location === "") {
        document.getElementById("errorLocation").innerText = "Location is required.";
        valid = false;
      }

      if (profession === "") {
        document.getElementById("errorProfession").innerText = "Profession is required.";
        valid = false;
      }

      if (!blood) {
        document.getElementById("errorBlood").innerText = "Please select YES or NO.";
        valid = false;
      }

      if (valid) {
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Processing...`;
        submitBtn.disabled = true;
      } else {
        e.preventDefault();
      }
    };
  </script>
</body>
</html>
