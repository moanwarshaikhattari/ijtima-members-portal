{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% include "head.html" %}
  <title>{{ title }}</title>
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand"><span class=""><img style="vertical-align: baseline !important;" src="/static/assets/images/madina.png" alt="midana logo" width="50px"></i></span><span><strong>Forgot Password</strong><small>Get a reset link for your account.</small></span></a>
      <div class="auth-visual"><img src="/static/assets/images/di-logo-new.png" alt="Dawate Islami"></div>
      <form class="needs-validation" novalidate>
        <div class="mb-4"><label class="form-label" for="forgotEmail">Email address</label><input class="form-control" id="forgotEmail" type="email" required><div class="invalid-feedback">Enter a valid email.</div></div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-envelope-arrow-up" aria-hidden="true"></i> Send Reset Link</button>
      </form>
      <p class="text-muted small mt-3 mb-0">Check your inbox and spam folder after submitting.</p>
      <div class="auth-footer">Remembered it? <a href="{% url 'login' %}">Back to login</a></div>
    </section>
  </main>

  <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>
</body>
</html>
